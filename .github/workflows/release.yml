name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

env:
  GO_VERSION: "1.26.4"
  ANDROID_NDK_VERSION: "27.0.12077973"

jobs:
  build-desktop:
    name: Desktop binaries (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            archive: openflux-linux-amd64
          - goos: linux
            goarch: arm64
            archive: openflux-linux-arm64
          - goos: windows
            goarch: amd64
            archive: openflux-windows-amd64
          - goos: darwin
            goarch: amd64
            archive: openflux-macos-amd64
          - goos: darwin
            goarch: arm64
            archive: openflux-macos-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w" -o openflux .

      - name: Package
        shell: bash
        run: |
          tar czf ${{ matrix.archive }}.tar.gz openflux
          sha256sum ${{ matrix.archive }}.tar.gz > ${{ matrix.archive }}.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: |
            ${{ matrix.archive }}.tar.gz
            ${{ matrix.archive }}.tar.gz.sha256

  build-mobile:
    name: Android core (NDK-built PIE binaries, per ABI)
    runs-on: ubuntu-latest
    # Shipped as standalone PIE executables, not JNI/AAR. On-device they live
    # in jniLibs/<abi>/lib<name>.so and are launched from nativeLibraryDir.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install Android SDK components
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          [ -n "$SDK" ] || { echo "ANDROID_HOME/ANDROID_SDK_ROOT not set" >&2; exit 1; }
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0" "ndk;${ANDROID_NDK_VERSION}"

      - name: Build Android executables (all ABIs)
        # Inlined here — no build-bin.sh dependency at the repo root.
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          [ -n "$SDK" ] || { echo "ANDROID_HOME/ANDROID_SDK_ROOT not set" >&2; exit 1; }
          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"
          export ANDROID_NDK_HOME="${ANDROID_NDK_HOME:-$SDK/ndk/${ANDROID_NDK_VERSION}}"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          [ -d "$ANDROID_NDK_HOME" ] || { echo "NDK dir missing: $ANDROID_NDK_HOME" >&2; exit 1; }

          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          [ -d "$TOOLCHAIN" ] || { echo "NDK toolchain not found: $TOOLCHAIN" >&2; exit 1; }

          API="${ANDROID_API:-21}"
          OUT_ROOT="dist/android"
          rm -rf "$OUT_ROOT"

          TARGETS=(
            "arm64:aarch64-linux-android:arm64-v8a"
            "arm:armv7a-linux-androideabi:armeabi-v7a"
            "amd64:x86_64-linux-android:x86_64"
          )

          for ENTRY in "${TARGETS[@]}"; do
            IFS=: read -r GOARCH_FOR_TARGET NDK_TRIPLE ABI_DIR <<<"$ENTRY"

            CC="$TOOLCHAIN/bin/${NDK_TRIPLE}${API}-clang"
            CXX="$TOOLCHAIN/bin/${NDK_TRIPLE}${API}-clang++"
            [ -x "$CC" ] || { echo "missing compiler: $CC" >&2; exit 1; }

            OUT_DIR="$OUT_ROOT/$ABI_DIR"
            mkdir -p "$OUT_DIR"

            echo "==> $ABI_DIR (GOARCH=$GOARCH_FOR_TARGET, CC=$CC)"
            env \
              GOOS=android \
              GOARCH="$GOARCH_FOR_TARGET" \
              CGO_ENABLED=1 \
              CC="$CC" \
              CXX="$CXX" \
              go build \
                -trimpath \
                -ldflags "-s -w -extldflags '-pie'" \
                -o "$OUT_DIR/libopenflux.so" \
                .
          done

          echo "Done. Artifacts:"
          find "$OUT_ROOT" -type f -exec file {} \;

      - name: Verify every artifact is a PIE ELF
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          READELF="$SDK/ndk/${ANDROID_NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          [ -x "$READELF" ] || { echo "llvm-readelf not found: $READELF" >&2; exit 1; }
          for BIN in dist/android/*/lib*.so; do
            [ -f "$BIN" ] || { echo "no binary matched $BIN" >&2; exit 1; }
            echo "== $BIN"
            file "$BIN"
            "$READELF" -h "$BIN" | grep -E 'Type:|Machine:'
            "$READELF" -h "$BIN" | grep -q 'DYN (Position-Independent Executable' || {
              echo "$BIN is not a PIE executable" >&2
              exit 1
            }
          done

      - name: Package
        shell: bash
        run: |
          set -e
          mkdir -p out
          # Flatten dist/android/<abi>/lib*.so -> out/<abi>/
          for ABI_DIR in dist/android/*/; do
            ABI="$(basename "$ABI_DIR")"
            mkdir -p "out/$ABI"
            cp "$ABI_DIR"/lib*.so "out/$ABI/"
          done
          (cd out && find . -type f -exec sha256sum {} \; > SHA256SUMS)
          zip -r openflux-android-bin.zip out
          sha256sum openflux-android-bin.zip > openflux-android-bin.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: openflux-android-bin
          path: |
            openflux-android-bin.zip
            openflux-android-bin.zip.sha256

  build-ios:
    name: iOS core
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build iOS core
        run: bash ./build_ios.sh

      - name: Package
        shell: bash
        run: |
          mkdir -p out
          cp -r output/ios/* out/ 2>/dev/null || true
          ls -la out || true
          cd out && zip -r ../openflux-ios.zip . && cd -
          shasum -a 256 openflux-ios.zip > openflux-ios.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: openflux-ios
          path: |
            openflux-ios.zip
            openflux-ios.zip.sha256

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [build-desktop, build-mobile, build-ios]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
