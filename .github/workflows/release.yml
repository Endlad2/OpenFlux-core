name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

# Go 1.22 — последняя ветка, где wlynxg/anet (транзитивная зависимость
# pion/webrtc) ещё работает: пакет использует //go:linkname на приватное
# поле net.zoneCache, которое убрали в Go 1.24+.
# Desktop-таргеты могли бы собираться и на 1.26 (CGO_ENABLED=0, anet не
# подключается), но единая версия избавляет от "работает локально, падает
# в CI" и от двух разных рантаймов в одном релизе.
env:
  GO_VERSION: "1.22.12"

jobs:
  build-desktop:
    name: Desktop binaries (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            archive: openflux-linux-amd64
          - goos: linux
            goarch: arm64
            archive: openflux-linux-arm64
          - goos: windows
            goarch: amd64
            archive: openflux-windows-amd64
          - goos: darwin
            goarch: amd64
            archive: openflux-macos-amd64
          - goos: darwin
            goarch: arm64
            archive: openflux-macos-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Pin go.mod to 1.22 so `go mod tidy` doesn't bump it back and
      # doesn't pull deps that require a newer toolchain.
      - name: Pin module to Go 1.22
        run: |
          go mod edit -go=1.22
          go mod edit -toolchain=none 2>/dev/null || true
          go mod tidy -go=1.22

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w" -o openflux .

      - name: Package
        shell: bash
        run: |
          tar czf ${{ matrix.archive }}.tar.gz openflux
          sha256sum ${{ matrix.archive }}.tar.gz > ${{ matrix.archive }}.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: |
            ${{ matrix.archive }}.tar.gz
            ${{ matrix.archive }}.tar.gz.sha256

  build-mobile:
    name: Android cores (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            goarch: arm64
            cc: aarch64-linux-android21-clang
            archive: openflux-android-arm64
          - abi: armeabi-v7a
            goarch: arm
            cc: armv7a-linux-androideabi21-clang
            archive: openflux-android-armv7
          - abi: x86_64
            goarch: amd64
            cc: x86_64-linux-android21-clang
            archive: openflux-android-x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Same pin as desktop: keep go.mod at 1.22 so the module graph is
      # resolved against 1.22-compatible versions only.
      - name: Pin module to Go 1.22
        run: |
          go mod edit -go=1.22
          go mod edit -toolchain=none 2>/dev/null || true
          go mod tidy -go=1.22

      - name: Build Android core
        shell: bash
        run: |
          set -e
          NDK_DIR=$(ls -d "${ANDROID_NDK_HOME:-$ANDROID_SDK_ROOT/ndk/*}" 2>/dev/null | sort -V | tail -n1)
          if [ -z "$NDK_DIR" ]; then
            NDK_DIR=$(ls -d "$ANDROID_SDK_ROOT/ndk/"*/ | sort -V | tail -n1)
          fi
          echo "Using NDK: $NDK_DIR"
          TOOLCHAIN="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin"
          if [ ! -d "$TOOLCHAIN" ]; then
            TOOLCHAIN="$NDK_DIR/toolchains/llvm/prebuilt/darwin-x86_64/bin"
          fi
          export CC="$TOOLCHAIN/${{ matrix.cc }}"
          export CXX="$TOOLCHAIN/${{ matrix.cc }}++"
          mkdir -p out/android/${{ matrix.abi }}
          GOOS=android GOARCH=${{ matrix.goarch }} CGO_ENABLED=1 \
            go build -trimpath -ldflags "-s -w" -o out/android/${{ matrix.abi }}/openflux .

      - name: Package
        shell: bash
        run: |
          cd out
          zip -r ../${{ matrix.archive }}.zip android
          cd ..
          sha256sum ${{ matrix.archive }}.zip > ${{ matrix.archive }}.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: |
            ${{ matrix.archive }}.zip
            ${{ matrix.archive }}.zip.sha256

  build-ios:
    name: iOS core
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Pin module to Go 1.22
        run: |
          go mod edit -go=1.22
          go mod edit -toolchain=none 2>/dev/null || true
          go mod tidy -go=1.22

      - name: Build iOS core
        run: bash ./build_ios.sh

      - name: Package
        shell: bash
        run: |
          mkdir -p out
          cp -r output/ios/* out/ 2>/dev/null || true
          ls -la out || true
          cd out && zip -r ../openflux-ios.zip . && cd -
          shasum -a 256 openflux-ios.zip > openflux-ios.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: openflux-ios
          path: |
            openflux-ios.zip
            openflux-ios.zip.sha256

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [build-desktop, build-mobile, build-ios]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
