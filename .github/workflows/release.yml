name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

env:
  GO_VERSION: "1.26.4"

jobs:
  build-desktop:
    name: Desktop binaries (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            archive: openflux-linux-amd64
          - goos: linux
            goarch: arm64
            archive: openflux-linux-arm64
          - goos: windows
            goarch: amd64
            archive: openflux-windows-amd64
          - goos: darwin
            goarch: amd64
            archive: openflux-macos-amd64
          - goos: darwin
            goarch: arm64
            archive: openflux-macos-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w" -o openflux .

      - name: Package
        shell: bash
        run: |
          tar czf ${{ matrix.archive }}.tar.gz openflux
          sha256sum ${{ matrix.archive }}.tar.gz > ${{ matrix.archive }}.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: |
            ${{ matrix.archive }}.tar.gz
            ${{ matrix.archive }}.tar.gz.sha256

  build-mobile:
    name: Android core (.aar)
    runs-on: ubuntu-latest
    # The artifact the Android app links: gomobile bind over mobile/. Replaces
    # the old per-ABI `go build` of the CLI, which produced a binary the app
    # could not use.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260908204917-8b95e45f8d3e
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260908204917-8b95e45f8d3e

      - name: Build the .aar
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: bash scripts/build-android-core.sh

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp output/android/openflux.aar dist/
          cp output/android/openflux-core.version dist/
          cd dist
          zip -r ../openflux-android-aar.zip .
          cd ..
          sha256sum openflux-android-aar.zip > openflux-android-aar.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: openflux-android-aar
          path: |
            openflux-android-aar.zip
            openflux-android-aar.zip.sha256

  build-ios:
    name: iOS core
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build iOS core
        run: bash ./build_ios.sh

      - name: Package
        shell: bash
        run: |
          mkdir -p out
          cp -r output/ios/* out/ 2>/dev/null || true
          ls -la out || true
          cd out && zip -r ../openflux-ios.zip . && cd -
          shasum -a 256 openflux-ios.zip > openflux-ios.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: openflux-ios
          path: |
            openflux-ios.zip
            openflux-ios.zip.sha256

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [build-desktop, build-mobile, build-ios]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
