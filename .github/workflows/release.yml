name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

env:
  GO_VERSION: "1.26.4"
  ANDROID_NDK_VERSION: "27.0.12077973"

jobs:
  build-desktop:
    name: Desktop binaries (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            archive: openflux-linux-amd64
          - goos: linux
            goarch: arm64
            archive: openflux-linux-arm64
          - goos: windows
            goarch: amd64
            archive: openflux-windows-amd64
          - goos: darwin
            goarch: amd64
            archive: openflux-macos-amd64
          - goos: darwin
            goarch: arm64
            archive: openflux-macos-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w" -o openflux .

      - name: Package
        shell: bash
        run: |
          tar czf ${{ matrix.archive }}.tar.gz openflux
          sha256sum ${{ matrix.archive }}.tar.gz > ${{ matrix.archive }}.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: |
            ${{ matrix.archive }}.tar.gz
            ${{ matrix.archive }}.tar.gz.sha256

  build-mobile:
    name: Android core (.aar, per ABI)
    runs-on: ubuntu-latest
    # The artifacts the Android app links: per-ABI AARs produced by
    # ./build-aar.sh, which runs gomobile bind once per target
    # (arm64 -> arm64-v8a, arm -> armeabi-v7a, amd64 -> x86_64).
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install Android SDK components
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          [ -n "$SDK" ] || { echo "ANDROID_HOME/ANDROID_SDK_ROOT not set" >&2; exit 1; }
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0" "ndk;${ANDROID_NDK_VERSION}"

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260908204917-8b95e45f8d3e
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260908204917-8b95e45f8d3e

      - name: Build the .aar files
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"
          export ANDROID_NDK_HOME="$SDK/ndk/${ANDROID_NDK_VERSION}"
          [ -d "$ANDROID_NDK_HOME" ] || { echo "NDK dir missing: $ANDROID_NDK_HOME" >&2; exit 1; }
          bash build-aar.sh

      - name: Package
        shell: bash
        run: |
          set -e
          mkdir -p out
          cp dist/openflux-android-*.aar out/
          cd out
          sha256sum openflux-android-*.aar > SHA256SUMS
          zip -r ../openflux-android-aar.zip .
          cd ..
          sha256sum openflux-android-aar.zip > openflux-android-aar.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: openflux-android-aar
          path: |
            openflux-android-aar.zip
            openflux-android-aar.zip.sha256

  build-ios:
    name: iOS core
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build iOS core
        run: bash ./build_ios.sh

      - name: Package
        shell: bash
        run: |
          mkdir -p out
          cp -r output/ios/* out/ 2>/dev/null || true
          ls -la out || true
          cd out && zip -r ../openflux-ios.zip . && cd -
          shasum -a 256 openflux-ios.zip > openflux-ios.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: openflux-ios
          path: |
            openflux-ios.zip
            openflux-ios.zip.sha256

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [build-desktop, build-mobile, build-ios]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
