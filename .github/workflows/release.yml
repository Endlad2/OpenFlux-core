name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

env:
  GO_VERSION: "1.26.4"

jobs:
  build-desktop:
    name: Desktop binaries (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            archive: openflux-linux-amd64
          - goos: linux
            goarch: arm64
            archive: openflux-linux-arm64
          - goos: windows
            goarch: amd64
            archive: openflux-windows-amd64
          - goos: darwin
            goarch: amd64
            archive: openflux-macos-amd64
          - goos: darwin
            goarch: arm64
            archive: openflux-macos-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w" -o openflux .

      - name: Package
        run: |
          tar czf ${{ matrix.archive }}.tar.gz openflux
          sha256sum ${{ matrix.archive }}.tar.gz > ${{ matrix.archive }}.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: |
            ${{ matrix.archive }}.tar.gz
            ${{ matrix.archive }}.tar.gz.sha256

  build-mobile:
    name: Mobile cores (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64
            archive: openflux-android-arm64
          - target: arm
            archive: openflux-android-armv7
          - target: x86_64
            archive: openflux-android-x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Android NDK
        run: |
          NDK_DIR=$(ls -d $ANDROID_SDK_ROOT/ndk/*/ 2>/dev/null | sort -V | tail -n1)
          echo "ANDROID_NDK_HOME=${NDK_DIR%/}" >> $GITHUB_ENV

      - name: Build Android core
        run: bash ./build_android.sh ${{ matrix.target }}

      - name: Package
        run: |
          mkdir -p out
          cp -r android/* out/ 2>/dev/null || true
          cd out && zip -r ../${{ matrix.archive }}.zip . && cd -
          sha256sum ${{ matrix.archive }}.zip > ${{ matrix.archive }}.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: |
            ${{ matrix.archive }}.zip
            ${{ matrix.archive }}.zip.sha256

  build-ios:
    name: iOS core
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build iOS core
        run: bash ./build_ios.sh

      - name: Package
        run: |
          zip -r openflux-ios.xcframework.zip ios-app 2>/dev/null || zip -r openflux-ios.zip . -i '*.xcframework' '*.a' '*.h'
          shasum -a 256 openflux-ios*.zip > openflux-ios.zip.sha256 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: openflux-ios
          path: |
            openflux-ios*.zip
          if-no-files-found: warn

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [build-desktop, build-mobile, build-ios]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}