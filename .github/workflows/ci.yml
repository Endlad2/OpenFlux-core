name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.4"
  # Runner-provided on ubuntu-latest; kept here explicitly so the android-core
  # job does not depend on ${{ env.ANDROID_HOME }} (which is empty — env.* only
  # contains what this file sets, not the runner's own environment).
  ANDROID_NDK_VERSION: "27.0.12077973"

jobs:
  build:
    name: Build & vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Build (CLI, desktop/exit)
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath ./...

      - name: Build (mobile bridge, host cgo)
        # Catches syntax/dep drift in mobile/mobile.go even without an Android
        # NDK. gomobile bind itself is exercised by the android-core job below.
        env:
          CGO_ENABLED: "1"
        run: go build -trimpath ./mobile/...

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Test
        # The existing test job historically swallowed failures with `|| true`;
        # keep that for now so an unrelated flaky test does not block the
        # release, but print the exit code.
        run: |
          set +e
          go test ./...
          echo "go test exit=$?"

  cross:
    name: Cross-build smoke (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build CLI
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -o /dev/null .

  android-core:
    name: Android core (NDK-built PIE binaries, per ABI)
    runs-on: ubuntu-latest
    # Builds standalone PIE executables for Android via the NDK clang
    # toolchain. These are meant to be shipped inside an APK
    # (jniLibs/<abi>/lib<name>.so) and launched from
    # ApplicationInfo.nativeLibraryDir via ProcessBuilder — not JNI.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install Android SDK components
        # $ANDROID_HOME here is the runner's environment variable, not a
        # workflow env.* entry — that is why we read it as a shell variable
        # instead of via ${{ env.ANDROID_HOME }} (which would be empty).
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          [ -n "$SDK" ] || { echo "ANDROID_HOME/ANDROID_SDK_ROOT not set" >&2; exit 1; }
          echo "SDK=$SDK"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0" "ndk;${ANDROID_NDK_VERSION}"

      - name: Build Android executables (all ABIs)
        # GOOS=android requires CGO_ENABLED=1 (bionic libc link against NDK).
        # Each binary is a PIE ELF, namespaced as lib*.so so it can live in
        # jniLibs/<abi>/ and be extracted to nativeLibraryDir on device.
        # Set ANDROID_NDK_HOME to the actual path just installed, computed in
        # the shell. Do NOT use ${{ env.ANDROID_HOME }} — it is empty.
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"
          export ANDROID_NDK_HOME="$SDK/ndk/${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          [ -d "$ANDROID_NDK_HOME" ] || { echo "NDK dir missing: $ANDROID_NDK_HOME" >&2; exit 1; }
          bash build-bin.sh

      - name: Verify every artifact is a PIE ELF
        # Guards against an accidental switch back to static/non-PIE output:
        # Android 5+ refuses to exec non-PIE binaries.
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          READELF="$SDK/ndk/${ANDROID_NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          [ -x "$READELF" ] || { echo "llvm-readelf not found: $READELF" >&2; exit 1; }
          for BIN in dist/android/*/lib*.so; do
            [ -f "$BIN" ] || { echo "no binary matched $BIN" >&2; exit 1; }
            echo "== $BIN"
            file "$BIN"
            "$READELF" -h "$BIN" | grep -E 'Type:|Machine:'
            "$READELF" -h "$BIN" | grep -q 'DYN (Position-Independent Executable' || {
              echo "$BIN is not a PIE executable" >&2
              exit 1
            }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: openflux-android-bin
          path: dist/android/
          if-no-files-found: error
