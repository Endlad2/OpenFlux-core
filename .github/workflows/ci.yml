name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.4"
  # Runner-provided on ubuntu-latest; kept here explicitly so the android-core
  # job does not depend on ${{ env.ANDROID_HOME }} (which is empty — env.* only
  # contains what this file sets, not the runner's own environment).
  ANDROID_NDK_VERSION: "27.0.12077973"
  # The exact x/mobile revision CI installs; kept in sync with go.mod's
  # `tool golang.org/x/mobile/cmd/gobind` / `require golang.org/x/mobile`.
  X_MOBILE_VERSION: "v0.0.0-20260908204917-8b95e45f8d3e"

jobs:
  build:
    name: Build & vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Build (CLI, desktop/exit)
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath ./...

      - name: Build (mobile bridge, host cgo)
        # Catches syntax/dep drift in mobile/mobile.go even without an Android
        # NDK. gomobile bind itself is exercised by the android-core job below.
        env:
          CGO_ENABLED: "1"
        run: go build -trimpath ./mobile/...

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Test
        # The existing test job historically swallowed failures with `|| true`;
        # keep that for now so an unrelated flaky test does not block the
        # release, but print the exit code.
        run: |
          set +e
          go test ./...
          echo "go test exit=$?"

  cross:
    name: Cross-build smoke (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build CLI
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -o /dev/null .

  android-core:
    name: Android core (gomobile bind)
    runs-on: ubuntu-latest
    # Builds the .aar the Android app links against, so a broken mobile/
    # package fails CI here instead of in the app's release job.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        # $ANDROID_HOME here is the runner's environment variable, not a
        # workflow env.* entry — that is why we read it as a shell variable
        # instead of via ${{ env.ANDROID_HOME }} (which would be empty).
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          [ -n "$SDK" ] || { echo "ANDROID_HOME/ANDROID_SDK_ROOT not set" >&2; exit 1; }
          echo "SDK=$SDK"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0" "ndk;${ANDROID_NDK_VERSION}"

      - name: Install gomobile
        # Same revision as go.mod's `tool golang.org/x/mobile/cmd/gobind`,
        # so gomobile and the module graph agree. The install path matters:
        # x/mobile/cmd/gomobile is a separate binary from gobind.
        run: |
          go install golang.org/x/mobile/cmd/gomobile@${X_MOBILE_VERSION}
          go install golang.org/x/mobile/cmd/gobind@${X_MOBILE_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Ensure x/mobile stays in the module graph
        # Belt and braces for go.dev/issue/77183: gomobile bind needs
        # golang.org/x/mobile as a module dependency. The `tool` directive in
        # go.mod plus mobile/bind_tool.go (//go:build tools) hold it in;
        # verify that before invoking bind, so a future go mod tidy cannot
        # silently drop it and leave a mysterious failure.
        run: |
          set -e
          go mod tidy
          grep -q 'golang.org/x/mobile' go.mod || {
            echo "golang.org/x/mobile fell out of go.mod after 'go mod tidy'" >&2
            echo "Restore the 'tool golang.org/x/mobile/cmd/gobind' directive" >&2
            echo "and the blank import in mobile/bind_tool.go." >&2
            exit 1
          }

      - name: Build the .aar
        # Set ANDROID_NDK_HOME to the actual path just installed, computed in
        # the shell. Do NOT use ${{ env.ANDROID_HOME }} — it is empty.
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"
          export ANDROID_NDK_HOME="$SDK/ndk/${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          [ -d "$ANDROID_NDK_HOME" ] || { echo "NDK dir missing" >&2; exit 1; }
          bash scripts/build-android-core.sh

      - name: Verify the Java class name
        # The Android app imports io.openflux.bridge.mobile.Mobile; a rename
        # here would break every Kotlin call site, so guard it explicitly.
        run: |
          set -e
          AAR="output/android/openflux.aar"
          [ -f "$AAR" ] || { echo "$AAR was not produced" >&2; exit 1; }
          unzip -l "$AAR" | grep -q 'classes.jar' || { echo "$AAR has no classes.jar" >&2; exit 1; }
          rm -rf /tmp/aar && mkdir -p /tmp/aar && cd /tmp/aar
          unzip -o "$GITHUB_WORKSPACE/$AAR" classes.jar >/dev/null
          unzip -l classes.jar | tee /tmp/classes.txt
          grep -q 'io/openflux/bridge/mobile/Mobile.class' /tmp/classes.txt || {
            echo "expected io/openflux/bridge/mobile/Mobile.class in the .aar" >&2
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: openflux-aar
          path: output/android/openflux.aar
          if-no-files-found: error
